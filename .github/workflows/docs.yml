name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - src/main/kotlin/**
      - src/test/kotlin/**
      - pom.xml
      - .github/workflows/docs.yml
      - .github/scripts/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, not mutable tags - this workflow runs with
      # pages: write and id-token: write, so a retagged action release
      # would be a direct supply-chain path. Dependabot proposes bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Installed from a fully resolved, hash-pinned requirements file:
      # a compromised or yanked release cannot silently enter the docs
      # build, and the published site is reproducible. Regenerate after
      # changing the doc toolchain with:
      #   pip-compile --generate-hashes --strip-extras \
      #     --output-file=.github/docs-requirements.txt <(echo mkdocs-material)
      # Dependabot keeps the pins current (pip ecosystem, /.github).
      - name: Install MkDocs Material
        run: pip install --require-hashes -r .github/docs-requirements.txt

      # Runs the offline suite so the published test evidence and coverage
      # always describe the commit being deployed - the site never shows
      # numbers a human typed. A red suite blocks the docs deploy on
      # purpose: stale docs beat docs that certify a broken build.
      - name: Run the test suite (Surefire results + JaCoCo report)
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Generate the test-evidence page
        run: python3 .github/scripts/generate-test-catalog.py

      - name: Build site
        run: mkdocs build --strict

      - name: Build API reference (Dokka)
        run: mvn --batch-mode --no-transfer-progress dokka:dokka

      - name: Add API reference to site
        run: cp -r target/dokka site/api

      - name: Add coverage report and badge to site
        run: |
          cp -r target/site/jacoco site/coverage
          python3 .github/scripts/generate-coverage-badge.py target/site/jacoco/jacoco.csv site/coverage/badge.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
