name: ClusterFuzzLite batch fuzzing

# Daily time-boxed fuzzing of the Jazzer targets in .clusterfuzzlite/fuzz/
# (see CONTRIBUTING.md). A crash fails the run and attaches the reproducing
# input as a workflow artifact; turn such an input into a regression test.
# Without an external corpus repository every run starts from scratch - a
# deliberate simplicity trade-off for now.

on:
  schedule:
    - cron: "53 2 * * *"
  # Manual runs for trying out new fuzz targets.
  workflow_dispatch:

permissions: read-all

jobs:
  batch-fuzzing:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    steps:
      # Pinned to the commit behind the v1 tag - the ClusterFuzzLite actions
      # check out this repository themselves, so no actions/checkout here.
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@82652fb49e77bc29c35da1167bb286e93c6bcc05 # v1
        with:
          language: jvm
          sanitizer: address

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@82652fb49e77bc29c35da1167bb286e93c6bcc05 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 1800
          mode: batch
          sanitizer: address
