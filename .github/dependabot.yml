version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR for every github/codeql-action step: CodeQL refuses a workflow
    # whose init, analyze and upload-sarif steps run different versions
    # ("Loaded a configuration file for version X, but running version Y"),
    # so single-step bumps fail on their own (tabellarium #70/#71).
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
  # The hash-pinned documentation toolchain: pinning keeps a compromised
  # release out, Dependabot keeps the pin from going stale.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    ignore:
      # 1.2.3 adds a dependency on properdocs, a separate MkDocs fork, only
      # to print a "switch to properdocs" warning in the build log; the
      # redirect output is the same as 1.2.2's. Moving the docs toolchain
      # towards properdocs is a decision for the whole toolchain, not a
      # side effect of a plugin bump (see the comment in docs.yml).
      - dependency-name: mkdocs-redirects
        versions: [">=1.2.3"]
