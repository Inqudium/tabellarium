version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The hash-pinned documentation toolchain: pinning keeps a compromised
  # release out, Dependabot keeps the pin from going stale.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
