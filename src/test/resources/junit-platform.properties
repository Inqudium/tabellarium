# Suite-wide safety net (DEFECT_ANALYSIS-2026-10-10T15-19-31, finding 3):
# a regression that parks the test thread (an untimed latch or a blocking
# hand-off) fails that one test instead of hanging the build. Plain @Test
# methods only - @FuzzTest is a test template with its own maxDuration.
junit.jupiter.execution.timeout.test.method.default = 2 m
