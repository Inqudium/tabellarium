# Filtered by Maven at build time (see the <resources> configuration in
# the pom); read by MessageEnricher to populate the meta.agent.version
# header so it can never drift from the artifact version. The @..@
# delimiters are configured on the maven-resources-plugin in the pom
# (the default ${..} delimiters are disabled so Spring placeholders
# survive filtering).
version=@project.version@
